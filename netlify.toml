[build]
  publish = "."

# Todo lo que llegue por un dominio antiguo o por www se redirige (301) al dominio principal.
[[redirects]]
  from = "https://thunderous-blini-7506fb.netlify.app/*"
  to = "https://cerrajeromadridcentro.es/:splat"
  status = 301
  force = true

